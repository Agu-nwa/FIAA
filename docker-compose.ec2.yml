services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fiaa
      POSTGRES_USER: fiaa_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.ec2}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiaa_app -d fiaa"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://fiaa_app:${POSTGRES_PASSWORD}@db:5432/fiaa
      DATABASE_SSL: "false"
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env.ec2}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:?Set PUBLIC_WEB_ORIGIN in .env.ec2}
      PUBLIC_ASSET_BASE_URL: ${PUBLIC_WEB_ORIGIN}/assets
      SERVE_STOREFRONT: "true"
      PUBLIC_INDEXING: "false"
      TRUST_PROXY: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
